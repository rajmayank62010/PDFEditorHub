version: '3.9'

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: pdfeditorhub-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pdfhub-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: pdfeditorhub-backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AllowedOrigins__0=https://pdfeditorhub.com
      - AllowedOrigins__1=http://localhost:3000
    networks:
      - pdfhub-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  nginx:
    image: nginx:alpine
    container_name: pdfeditorhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - pdfhub-network

networks:
  pdfhub-network:
    driver: bridge

volumes:
  nginx-cache:
